name: konet
description: "end to end encryption communication app for friends and family."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^1.2.1
  dots_indicator: ^4.0.1
  country_code_picker: ^3.4.1
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  searchfield: ^2.0.0
  shared_preferences: ^2.3.5
  
  


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  

flutter:

  uses-material-design: true

  assets:
    - assets/image/



  fonts:
     - family: InstrumentSerif
       fonts:
         - asset: assets/fonts/Instrument_Serif/InstrumentSerif-Regular.ttf
